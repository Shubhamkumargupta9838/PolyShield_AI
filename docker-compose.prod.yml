services:
  mongodb:
    image: mongo:6.0
    container_name: polyshield_prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: polyshield_db
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - internal-db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis:
    image: redis:7.0-alpine
    container_name: polyshield_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - internal-db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: polyshield_prod_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=polyshield_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - app_storage:/app/data/storage
      - app_logs:/app/data/logs
    networks:
      - internal-backend
      - internal-db
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: polyshield_prod_worker
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=polyshield_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - app_storage:/app/data/storage
      - app_logs:/app/data/logs
    networks:
      - internal-db
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: polyshield_prod_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - frontend-edge
      - internal-backend
    depends_on:
      - backend
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  frontend-edge:
    driver: bridge
  internal-backend:
    driver: bridge
    internal: true
  internal-db:
    driver: bridge
    internal: true

volumes:
  mongo_prod_data:
  redis_prod_data:
  app_storage:
  app_logs:
